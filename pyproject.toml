[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "respnet"
version = "0.1.0"
description = "RespireNet reimplemented from scratch on ICBHI 2017, with subject-wise evaluation and on-device deployment profiling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohan Sakeri" }]

dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
tracking = [
    "mlflow>=2.16",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[project.scripts]
respnet-train = "respnet.train:main"
respnet-profile = "respnet.cli:profile_main"

[tool.hatch.build.targets.wheel]
packages = ["src/respnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires the ICBHI dataset or a training run",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/respnet"]
ignore_missing_imports = true
warn_unused_ignores = true
