name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-only torch to keep CI fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Test
        # Dataset-dependent tests are marked `slow` and skipped here; everything
        # else runs on synthetic fixtures so CI needs no data download.
        run: pytest -m "not slow" --cov=respnet --cov-report=term-missing

      - name: Enforce coverage floor
        run: pytest -m "not slow" --cov=respnet --cov-fail-under=80 -q
